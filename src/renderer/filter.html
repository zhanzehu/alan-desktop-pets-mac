<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' file:"
  />
  <title>轮播内容</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1b1e;
      --panel: #23252a;
      --line: #33363d;
      --text: #eceef2;
      --muted: #9298a4;
      --accent: #4f8cff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .modes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .mode {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .mode:hover {
      border-color: #454a55;
    }

    .mode[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(79, 140, 255, 0.14);
      color: #dfe9ff;
    }

    .list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 10px 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
    }

    .row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .idx {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      width: 20px;
      flex: 0 0 auto;
    }

    .label {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row.off .label {
      color: var(--muted);
      text-decoration: line-through;
    }

    .dur {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
    }

    .tag {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(79, 140, 255, 0.16);
      color: #9dc0ff;
      flex: 0 0 auto;
    }

    .preview {
      flex: 0 0 auto;
      width: 24px;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
    }

    .preview:hover {
      color: var(--text);
      border-color: #4a505c;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
      background: #17181b;
    }

    button.action {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button.action:hover {
      border-color: #4a505c;
    }

    button.action.primary {
      margin-left: auto;
      border-color: var(--accent);
      background: rgba(79, 140, 255, 0.16);
      color: #dfe9ff;
    }

    .hint {
      padding: 8px 18px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1 id="title">轮播内容</h1>
      <span class="count" id="count">—</span>
    </div>
    <div class="modes">
      <button class="mode" id="modeRandom" type="button" aria-pressed="true">随机一句</button>
      <button class="mode" id="modePinned" type="button" aria-pressed="false">固定一句</button>
    </div>
    <div class="hint">勾选 = 参与随机播放。取消全部勾选无意义，至少会保留一句。</div>
  </header>

  <div class="list" id="list"></div>

  <footer>
    <button class="action" id="restore" type="button">全部恢复</button>
    <button class="action primary" id="done" type="button">完成</button>
  </footer>

  <script src="filter.js"></script>
</body>
</html>
